dataset:
    source: HF
    name:  pg19
    config_name: None
    overwrite_cache: true
    base_dir:
    cache_dir:
    streaming: false
    char_level: false

model:
    name:
    base_dir:
    pre_trained_model_path:
    type: vanilla
    from_pre_trained: false
    res_dir:
    start_size: 4
    recent_size: 64
    num_hh_tokens: 64


n_gpus: 1
seed: 0

tokenizer:
    source: 'tiktoken'
    model_name: 'gpt2'

model_general:
    d_model: 256

ssm_args:
    d_state: 16
    n_layers: 2
    expand: 2
    d_intermediate: 512
    norm_epsilon: 1e-5
    rms_norm: true
    residual_in_fp32: true
    fused_add_norm: true

transformer_args:
    n_layers: 6
    n_heads: 8
    n_kv_heads: 8
    n_msks: 4
    multiple_of: 256  # make SwiGLU hidden layer size multiple of large power of 2
    ffn_dim_multiplier: 4
    intermediate_size: none
    norm_eps: 1e-5
    rope_theta: 500000

    max_batch_size: 32
    max_seq_len: 2048
    segment_transformer: true

    update_fill_values_dyn: true
    proj_fill_value_start: 1e-8
    proj_fill_value_end: 1e-12

    apply_pos_emb: True
    proj_layer_is_ssm: True


eval:
    eval_size: 2048
    batch_size: 2


wandb:
  name: ${model.name}
  group: ${dataset.name}_${model.name}
  project:
  entity:
  mode: disabled
